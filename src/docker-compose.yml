version: '3.8'


services:
  postgres:
    image: postgres:15-alpine
    container_name: dnd-postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: UYAHSGFudgashbUIDA
      POSTGRES_DB: dndappdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network
  
  app:
    build: .
    container_name: dnd_app
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: UYAHSGFudgashbUIDA
      POSTGRES_DB: dndappdb
      POSTGRES_HOST: postgres 
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge